# Example Codex configuration for Amazon Bedrock.
# Copy this to ~/.codex/config.toml and adjust the region/model as needed.
#
# Authentication (checked in this order by Codex):
#   1. AWS_BEARER_TOKEN_BEDROCK   (Bedrock API key)
#   2. AWS SDK credential chain   (env vars, aws configure, SSO, named profile)
# Do NOT set OPENAI_API_KEY for the Bedrock path.
#
# IMPORTANT (TOML structure): top-level Codex settings must appear BEFORE the
# [model_providers.amazon-bedrock.aws] header. Any key placed after that header
# belongs to the .aws table and is otherwise ignored by Codex. The built-in
# amazon-bedrock provider only reads `region` (and optionally `profile`);
# the responses wire API is already its default.

model = "openai.gpt-5.5"
model_provider = "amazon-bedrock"

model_context_window = 272000
model_auto_compact_token_limit = 220000
web_search = "disabled"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Use a Region where the openai.gpt-5.x models are served on the Bedrock
# responses endpoint. Verified working: us-east-2 and us-east-1.
[model_providers.amazon-bedrock.aws]
region = "us-east-2"

# Optional for AWS SDK auth. If omitted, the AWS SDK uses AWS_PROFILE or the
# default profile.
# profile = "codex-bedrock"
