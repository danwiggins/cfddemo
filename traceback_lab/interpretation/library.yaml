      clinical_setting: null
    license_ids: []
    flags: []
    headline: true
    stability: {kind: proportion}
    citations: []
    citation_checked: {by: "lab build agent", date: "2026-10-15", note: "No citation displayed; QC bands are provisional team defaults (not from literature)."}

