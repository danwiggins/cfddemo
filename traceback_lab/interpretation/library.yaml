    meaning_high: "Reads are human DNA that aligns cleanly."
    meaning_low: "Contamination, adapter dimers, very short inserts or a reference mismatch."
    confounders: ["bacterial or viral DNA", "adapter dimers", "wrong reference"]
    next_steps:
