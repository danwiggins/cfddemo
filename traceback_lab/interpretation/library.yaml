    label: "Primary reads"
    value_kind: count
    tier: PROVEN
    origin_tier: PROVEN
    origin_platform: "any"
    min_depth_x: null
    reference: {kind: none}
    performance: null
    performance_missing_reason: "QC measure, not a diagnostic"
    meaning_high: "More primary reads: more depth for other algorithms. Paired-end libraries contribute two reads per molecule."
    meaning_low: "Few primary reads: many algorithms will be skipped or not interpretable."
    confounders: ["flow-cell yield", "input cfDNA mass"]
    next_steps:
      analytical: ["Check the depth curve for what this read count supports"]
      clinical_setting: null
    license_ids: []
    flags: []
    headline: false
    stability: {kind: scales_with_depth, tolerance: 0.10}
    citations: []
