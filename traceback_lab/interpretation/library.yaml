  # --------------------------------------------------------- fragment-size
  - algorithm_id: fragment-size
    metric_id: mode_bp
    label: "Fragment length mode (aligned span)"
    value_kind: positive
    tier: NEWER
    origin_tier: NEWER
    origin_platform: "cfDNA literature (platform not stated) and Illumina"
    min_depth_x: 0.0055
    reference:
      kind: published_mean
      statistic: "mode, approximately"
      value: 167
      unit: bp
      source: "Chen 2025, Genome Res, background citing earlier studies"
    performance:
      kind: enrichment
      value: "Size selection of 90-150 bp fragments gave >2-fold median ctDNA enrichment in >95% of cases"
      platform: Illumina
      depth: "0.4x"
      source: "Mouliere 2018, Sci Transl Med"
    performance_missing_reason: null
    meaning_low: "A shorter mode can reflect tumour-derived DNA or pregnancy."
    meaning_high: "A longer mode can reflect library size bias (ONT over-represents fragments above 200 bp) or cell lysis."
    confounders: ["ONT library size bias", "chimeras", "pregnancy", "pre-analytic delay"]
    next_steps:
      analytical: ["Compare with the copy-number tumour fraction", "Check the library batch"]
      clinical_setting: "In a validated clinical setting, a shift like this would be read only together with a tumour-fraction estimate."
    license_ids: []
    flags: []
    headline: true
    stability: {kind: absolute, tolerance: 3}
    citations: ["doi:10.1101/gr.279144.124", "doi:10.1126/scitranslmed.aat4921"]
    citation_checked:
      by: "lab build agent"
      date: "2026-10-15"
      note: "PubMed full text PMC12047234 states, as background citing earlier studies, 'cfDNA has a fragment length mode at ~167 bp and at ~332 bp' (a mode, not a cohort mean; no n). PubMed abstract PMID 30404863: 90-150 bp selection, >2-fold median enrichment in >95% of cases, 0.4x (Illumina)."

