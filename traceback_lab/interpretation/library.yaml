# Traceback Lab interpretation library (D3, D7, D8, D27, D32).
# Read-time only: nothing here enters a result or an execution identity, so
# editing a footnote never re-keys a result.  One entry per
# (algorithm_id, metric_id).  Exactly one `headline: true` per algorithm.
#
# tier is judged AS RUN (ONT, kit depth); origin_tier/origin_platform carry the
# original evidence (D4).  citation_checked records who confirmed that every
# DOI resolves and every displayed number matches the source (D27); an entry
# without it renders an "UNVERIFIED citation" badge.
version: 0.1.0
hidden_algorithms: [read-summary]
entries:
  # ---------------------------------------------------------------- bam-qc
  - algorithm_id: bam-qc
    metric_id: total_reads
    label: "Primary reads"
    value_kind: count
    tier: PROVEN
    origin_tier: PROVEN
    origin_platform: "any"
    min_depth_x: null
    reference: {kind: none}
    performance: null
    performance_missing_reason: "QC measure, not a diagnostic"
    meaning_high: "More sequenced molecules: more depth for every other algorithm."
    meaning_low: "Few molecules: most algorithms will be skipped or not interpretable."
    confounders: ["flow-cell yield", "input cfDNA mass"]
    next_steps:
      analytical: ["Check the depth curve for what this read count supports"]
      clinical_setting: null
    license_ids: []
    flags: []
    headline: false
    stability: {kind: scales_with_depth, tolerance: 0.10}
    citations: []
    citation_checked: {by: "lab build agent", date: "2026-10-15", note: "No citation displayed; QC count."}

  - algorithm_id: bam-qc
