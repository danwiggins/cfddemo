name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Check names are "ci (macos-latest)" and "ci (ubuntu-latest)". Branch
  # protection in docs/DEVELOPMENT-CONTROL.md requires both. macOS team
  # workstations remain the product host (security spec X1, #86); the ubuntu
  # job keeps the code portable and catches Linux-only regressions.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.10"
          python-version: "3.11"
          enable-cache: true

      - name: Install samtools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y samtools

      - name: Install samtools (macOS)
        if: runner.os == 'macOS'
        run: brew install samtools

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff@0.7.4 check .

      # The local web service's single-instance lock is per state directory
      # (golden-path A3), so web tests run under xdist with everything else.
      - name: Test
        timeout-minutes: 40
        run: >-
          uv run pytest -p no:cacheprovider -n auto --timeout 600 -m "not slow"
          --durations=10
