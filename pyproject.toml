[project]
name = "traceback-evidence-inspector"
version = "0.1.0"
description = "Local-first cfDNA evidence inspection prototype with Amazon Bedrock review."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3==1.40.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pydantic==2.11.7",
    "pysam==0.23.3",
    "streamlit==1.48.0",
]

[project.scripts]
traceback = "traceback_runner.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
