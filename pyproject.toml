[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traceback-evidence-inspector"
version = "0.1.0"
description = "Local-first cfDNA research workbench: run public cfDNA methods on a BAM and chart the results."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography==46.0.3",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pydantic==2.11.7",
    "pysam==0.23.3",
    "pyyaml==6.0.3",
]

[project.scripts]
traceback = "traceback_runner.cli:main"

[dependency-groups]
dev = [
    # Test-only imports that streamlit used to pull in transitively.
    "jsonschema==4.26.0",
    "pandas==2.3.3",
    "pytest==8.4.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "websocket-client==1.9.2",
]
# Griffin's ONT port reads the registered k100 Umap mappability bigWig.
# A default group so a plain `uv sync` keeps it in the Lab environment.
griffin = [
    "pybigwig==0.3.26",
]

[tool.uv]
default-groups = ["dev", "griffin"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: long-running live harness tests; excluded from the default CI lane (run with -m slow)",
]

[tool.hatch.build.targets.wheel]
packages = ["evidence_inspector", "traceback_lab", "traceback_runner"]
